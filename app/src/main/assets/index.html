<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termux Omni AI Studio</title>
    <style>
        :root {
            --bg-main: #090d16;
            --panel-bg: #111827;
            --border: #1f2937;
            --accent: #38bdf8;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --success: #4ade80;
            --danger-red: #f87171;
            --danger-bg: #450a0a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

        header { background: #030712; padding: 6px 10px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; height: 42px; }
        header h1 { font-size: 0.9rem; color: var(--accent); display: flex; align-items: center; gap: 6px; }
        .header-actions { display: flex; gap: 6px; align-items: center; }
        .user-tag { font-size: 0.65rem; background: #1e293b; color: var(--accent); padding: 2px 5px; border-radius: 8px; border: 1px solid var(--border); }

        .app-nav { display: flex; background: #030712; padding: 4px 6px; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; flex-shrink: 0; height: 38px; align-items: center; }
        .nav-btn { background: var(--panel-bg); color: var(--text-muted); border: 1px solid var(--border); padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; white-space: nowrap; }
        .nav-btn.active { background: var(--accent); color: #090d16; border-color: var(--accent); font-weight: bold; }

        .container { flex: 1; display: none; padding: 6px; max-width: 800px; margin: 0 auto; width: 100%; flex-direction: column; gap: 6px; overflow: hidden; height: 100%; }
        .container.active { display: flex; }

        #chat-box { flex: 1; background: var(--panel-bg); border-radius: 6px; padding: 8px; overflow-y: auto; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; min-height: 0; }
        .message { padding: 7px 10px; border-radius: 6px; max-width: 85%; line-height: 1.3; font-size: 0.8rem; word-break: break-word; }
        .message.user { background: #0284c7; align-self: flex-end; color: white; }
        .message.gemini { background: #1f2937; align-self: flex-start; color: var(--text-main); border: 1px solid var(--border); }

        .chat-input-dock { background: var(--panel-bg); padding: 6px; border-radius: 6px; border: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        textarea, input[type="text"], input[type="password"] { width: 100%; background: #0b0f19; color: var(--text-main); border: 1px solid var(--border); padding: 6px; border-radius: 4px; font-size: 0.8rem; outline: none; resize: none; }
        .action-btn { background: var(--accent); color: #090d16; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 0.75rem; flex-shrink: 0; }

        .setting-group { background: var(--panel-bg); border: 1px solid var(--border); padding: 8px; border-radius: 6px; display: flex; flex-direction: column; gap: 6px; }
        .dev-danger-zone { border: 2px solid var(--danger-red) !important; background: var(--danger-bg) !important; }
        .status-note { font-size: 0.7rem; color: var(--text-muted); word-break: break-all; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Termux Omni AI</h1>
        <div class="header-actions">
            <span class="user-tag" id="header-username-display">User: Anon</span>
        </div>
    </header>

    <nav class="app-nav">
        <button class="nav-btn active" onclick="switchTab('chat', this)">💬 Chat</button>
        <button class="nav-btn" onclick="switchTab('settings', this)">⚙️ Settings</button>
    </nav>

    <!-- TAB 1: Chat -->
    <div id="tab-chat" class="container active">
        <div id="chat-box">
            <div class="message gemini" id="chat-welcome">Connecting to local bridge...</div>
        </div>

        <div class="chat-input-dock">
            <textarea id="chat-input" rows="1" placeholder="Type a message or command..."></textarea>
            <button class="action-btn" onclick="handleMainSend()">Send</button>
        </div>
    </div>

    <!-- TAB 2: Settings -->
    <div id="tab-settings" class="container" style="overflow-y: auto;">
        <div class="setting-group dev-danger-zone">
            <h3>⚡ Bridge, Model Path & API Configuration</h3>

            <label style="font-size:0.65rem; font-weight:bold; color:var(--accent);">GGUF Model File Path:</label>
            <input type="text" id="setting-gguf-path" placeholder="/sdcard/Download/model.gguf">
            <div id="gguf-path-status" class="status-note">Default: /sdcard/Download/model.gguf</div>

            <label style="font-size:0.65rem; font-weight:bold; color:var(--danger-red);">Local Bridge URL:</label>
            <input type="text" id="setting-bridge-url" placeholder="http://127.0.0.1:5004">

            <label style="font-size:0.65rem; font-weight:bold; color:var(--accent);">Gemini API Key (Optional Cloud):</label>
            <input type="password" id="dev-api-key" placeholder="Paste API key">
            <button class="action-btn" onclick="saveSettings()">Save Settings</button>
        </div>
    </div>

    <script src="main.js"></script>
    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function saveSettings() {
            const bridgeUrl = document.getElementById('setting-bridge-url').value.trim();
            const ggufPath = document.getElementById('setting-gguf-path').value.trim();
            const apiKey = document.getElementById('dev-api-key').value;

            if (bridgeUrl) {
                localStorage.setItem('termux_bridge_url', bridgeUrl);
                LOCAL_SERVER_URL = bridgeUrl;
            }
            if (apiKey) {
                localStorage.setItem('gemini_api_key', apiKey);
            }

            const pathRes = await setGgufModelPath(ggufPath);
            document.getElementById('gguf-path-status').innerText =
                pathRes.message || pathRes.error || `Active path: ${getSavedGgufPath()}`;

            alert("Settings saved successfully!");
            checkBridge();
        }

        async function handleMainSend() {
            const promptEl = document.getElementById('chat-input');
            const prompt = promptEl.value.trim();
            const chatBox = document.getElementById('chat-box');
            if (!prompt) return;

            chatBox.innerHTML += `<div class="message user">${prompt}</div>`;
            promptEl.value = "";

            const res = await runTermuxCommand(prompt);
            const reply = res.stdout || res.error || "Executed.";
            chatBox.innerHTML += `<div class="message gemini"><pre style="background:transparent; color:inherit; white-space:pre-wrap;">${reply}</pre></div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function checkBridge() {
            const customUrl = localStorage.getItem('termux_bridge_url') || "http://127.0.0.1:5004";
            document.getElementById('setting-bridge-url').value = customUrl;
            document.getElementById('setting-gguf-path').value = getSavedGgufPath();

            try {
                const res = await fetch(customUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "ping" })
                });
                const data = await res.json();
                document.getElementById('chat-welcome').innerText =
                    data.message || `Connected to local bridge at ${customUrl}!`;
                if (data.path) {
                    document.getElementById('gguf-path-status').innerText = `Active path: ${data.path}`;
                }
            } catch (err) {
                document.getElementById('chat-welcome').innerText =
                    `Bridge offline at ${customUrl}. Ensure the app foreground service is running.`;
            }
        }

        window.onload = function() {
            if (localStorage.getItem('gemini_api_key')) {
                document.getElementById('dev-api-key').value = localStorage.getItem('gemini_api_key');
            }
            checkBridge();
        };
    </script>
</body>
</html>
