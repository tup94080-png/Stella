name: Build Omni AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure llama.cpp exists
        run: |
          if [ ! -f app/src/main/cpp/llama.cpp/CMakeLists.txt ]; then
            rm -rf app/src/main/cpp/llama.cpp
            git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp
          fi

      - name: Patch llama_model_params use_mmap compatibility
        run: |
          if [ -f app/src/main/cpp/native-lib.cpp ]; then
            python3 -c '
          from pathlib import Path
          p = Path("app/src/main/cpp/native-lib.cpp")
          lines = p.read_text().splitlines(keepends=True)
          out = []
          for line in lines:
              if "use_mmap" in line and not line.lstrip().startswith("//"):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f"{indent}// {line.lstrip()}")
              else:
                  out.append(line)
          p.write_text("".join(out))
          '
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses and install NDK & CMake
        run: |
          SDK_MANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK_MANAGER" --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null || true
          "$SDK_MANAGER" --sdk_root=/usr/local/lib/android/sdk "ndk;26.3.11579264" "cmake;3.22.1"
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"

      - name: Configure Gradle properties
        run: |
          touch gradle.properties
          grep -q '^android.useAndroidX=' gradle.properties && sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -q '^android.enableJetifier=' gradle.properties && sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Bootstrap Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || {
            echo "=== ROOT ERROR SUMMARY ==="
            grep -nE "(FAILURE:|Caused by:|> Task .* FAILED|error:)" build.log | tail -n 30 || true
            exit 1
          }
        shell: bash

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniAI-arm64-debug
          path: app/build/outputs/apk/debug/*.apk
          
